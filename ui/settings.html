<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>alice 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <h1>alice 设置</h1>
      <p class="sub">语音与缩放保存后立刻生效；端口、对话命令下次启动生效。</p>
    </header>

    <main>
      <section>
        <h2>声音</h2>
        <label class="row check">
          <input type="checkbox" id="voice" />
          <span>自动念回复（回复完成时用语音念出来）</span>
        </label>
        <div class="row">
          <span class="key">引擎</span>
          <select id="ttsEngine">
            <option value="minimax">MiniMax 云端（推荐，中文自然）</option>
            <option value="sapi">本机 SAPI（离线，需装中文语音包）</option>
          </select>
        </div>
        <div class="row">
          <span class="key">音色</span>
          <input id="ttsVoice" list="voiceList" placeholder="female-tianmei" />
          <datalist id="voiceList">
            <option value="female-tianmei">甜美温柔</option>
            <option value="female-shaonv">少女</option>
            <option value="female-yujie">御姐</option>
            <option value="female-chengshu">成熟女性</option>
          </datalist>
        </div>
        <div class="row">
          <span class="key">模型</span>
          <input id="ttsModel" placeholder="speech-2.8-turbo" />
        </div>
        <div class="row">
          <span class="key">接口地址</span>
          <input id="ttsEndpoint" placeholder="https://api.minimaxi.com" />
        </div>
        <div class="row">
          <span class="key">代理</span>
          <input id="ttsProxy" placeholder="http://127.0.0.1:7890（留空则用系统代理）" />
        </div>
        <div class="row">
          <span class="key">key 环境变量</span>
          <input id="ttsKeyEnv" placeholder="MINIMAX_API_KEY" />
        </div>
        <div class="row">
          <span class="key">SAPI 音色</span>
          <input id="sapiVoice" placeholder="留空自动挑中文女声" />
        </div>
        <div class="row preview">
          <input id="previewText" placeholder="试听文本" />
          <button id="previewBtn" type="button">试听</button>
        </div>
        <p class="hint">key 只从环境变量读，不写进配置文件；本机没有女声时 SAPI 会静默跳过，不会用男声顶替。</p>
      </section>

      <section>
        <h2>说话（语音输入）</h2>
        <div class="row">
          <span class="key">识别服务</span>
          <input id="asrEndpoint" placeholder="http://127.0.0.1:8080/inference" />
        </div>
        <div class="row">
          <span class="key">ffmpeg</span>
          <input id="asrFfmpeg" placeholder="留空自动找 tools/ffmpeg.exe 或 PATH" />
        </div>
        <div class="row">
          <span class="key">语言</span>
          <input id="asrLanguage" placeholder="zh" />
        </div>
        <div class="row">
          <span class="key">麦克风</span>
          <input id="asrDevice" placeholder="留空自动挑第一个录音设备" />
        </div>
        <p class="hint">录音走本机麦克风，转写交给本机 whisper-server（默认 127.0.0.1:8080），不出网。</p>
      </section>

      <section>
        <h2>对话</h2>
        <div class="row col">
          <span class="key">命令（每行一个参数，<code>{prompt}</code> 会换成你输入的话）</span>
          <textarea id="chatCommand" rows="5" spellcheck="false"></textarea>
        </div>
        <div class="row">
          <span class="key">工作目录</span>
          <input id="chatCwd" placeholder="留空用桌宠自身目录" />
        </div>
        <div class="row col">
          <span class="key">环境变量（每行 KEY=VALUE）</span>
          <textarea id="chatEnv" rows="3" spellcheck="false"></textarea>
        </div>
      </section>

      <section>
        <h2>其他</h2>
        <div class="row">
          <span class="key">本地端口</span>
          <input id="port" type="number" min="1024" max="65535" />
        </div>
        <div class="row">
          <span class="key">大小</span>
          <select id="scale">
            <option value="0.8">小（80%）</option>
            <option value="1">中（100%）</option>
            <option value="1.2">大（120%）</option>
          </select>
        </div>
        <label class="row check">
          <input type="checkbox" id="alwaysOnTop" />
          <span>总在最前</span>
        </label>
        <p class="hint" id="configPath"></p>
      </section>
    </main>

    <footer>
      <span id="status"></span>
      <span class="spacer"></span>
      <button id="resetBtn" type="button" class="ghost">恢复默认</button>
      <button id="closeBtn" type="button" class="ghost">关闭</button>
      <button id="saveBtn" type="button" class="primary">保存</button>
    </footer>

    <script src="settings.js"></script>
  </body>
</html>
